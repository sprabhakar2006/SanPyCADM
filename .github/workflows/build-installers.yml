# Builds the self-contained SanPyCADM bundles on GitHub's macOS and
# Windows runners (PyInstaller cannot cross-compile). Push a v* tag and
# the finished bundles are attached to a GitHub release automatically.

name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (Apple Silicon)
            asset: SanPyCADM-mac-arm64.zip
          - os: windows-latest
            label: Windows (x64)
            asset: SanPyCADM-win-x64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build123d numpy scipy sympy scikit-image pywebview pyperclip manifold3d pyinstaller

      - name: Build bundle
        env:
          SANPYCADM_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
        run: python packaging/build_bundle.py

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - "dist/SanPyCADM.app"
          codesign --verify --verbose "dist/SanPyCADM.app"
          rm -f dist/SanPyCADM-mac.zip
          ditto -c -k --sequesterRsrc --keepParent "dist/SanPyCADM.app" dist/SanPyCADM-mac.zip

      - name: Name the asset
        shell: bash
        run: |
          built=$(ls dist/SanPyCADM-*.zip | head -1)
          mv "$built" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
